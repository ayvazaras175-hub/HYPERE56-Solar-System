
name: Build HYPERE56 SFS System

on:
  workflow_dispatch:
  push:
    paths:
      - "HYPERE56-SFS-System.zip"
      - ".github/workflows/extract-zip.yml"

permissions:
  contents: write

jobs:
  build-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract HYPERE56 system
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="HYPERE56-SFS-System.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name "Import_Settings.txt" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Import_Settings.txt not found!"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SETTINGS_FILE")

          for required in "Heightmap Data" "Planet Data"; do
            test -d "$SOURCE_DIR/$required" || {
              echo "::error::Missing folder: $required"
              exit 1
            }
          done

          for required in "Import_Settings.txt" "Space_Center_Data.txt" "Version.txt"; do
            test -f "$SOURCE_DIR/$required" || {
              echo "::error::Missing file: $required"
              exit 1
            }
          done

          mkdir -p "$SOURCE_DIR/Texture Data"

          # Eski sistem klasörlerini yenileriyle değiştir.
          rm -rf "Heightmap Data" "Planet Data" "Texture Data"

          cp -R "$SOURCE_DIR/Heightmap Data" .
          cp -R "$SOURCE_DIR/Planet Data" .
          cp -R "$SOURCE_DIR/Texture Data" .

          cp "$SOURCE_DIR/Import_Settings.txt" .
          cp "$SOURCE_DIR/Space_Center_Data.txt" .
          cp "$SOURCE_DIR/Version.txt" .

          # Boş klasörün GitHub'da görünmesini sağla.
          touch "Texture Data/.gitkeep"

      - name: Validate planet files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("Planet Data").glob("*.txt"))

          if not files:
              raise SystemExit("Planet Data is empty!")

          for file in files:
              with file.open(encoding="utf-8") as stream:
                  data = json.load(stream)

              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid JSON: {file.name}")

          print(f"Validated {len(files)} planet files.")
          PY

      - name: Commit system files to GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Heightmap Data" "Planet Data" "Texture Data"
          git add Import_Settings.txt Space_Center_Data.txt Version.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add HYPERE56 solar system files"
            git push
          fi

      - name: Upload ready-to-install system
        uses: actions/upload-artifact@v4
        with:
          name: HYPERE56-SFS-System
          path: |
            Heightmap Data/
            Planet Data/
            Texture Data/
            Import_Settings.txt
            Space_Center_Data.txt
            Version.txt
          if-no-files-found: error
          retention-days: 14
