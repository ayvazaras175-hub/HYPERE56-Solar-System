name: Build HYPERE56 SFS System

on:
  workflow_dispatch:
  push:
    paths:
      - "HYPERE56-SFS-System.zip"
      - ".github/workflows/extract-zip.yml"

permissions:
  contents: read

jobs:
  build-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate HYPERE56 system
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="HYPERE56-SFS-System.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name "Import_Settings.txt" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Import_Settings.txt not found!"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SETTINGS_FILE")

          for required in "Heightmap Data" "Planet Data" "Texture Data"; do
            if [ ! -d "$SOURCE_DIR/$required" ]; then
              echo "::error::Missing folder: $required"
              exit 1
            fi
          done

          for required in "Import_Settings.txt" "Space_Center_Data.txt" "Version.txt"; do
            if [ ! -f "$SOURCE_DIR/$required" ]; then
              echo "::error::Missing file: $required"
              exit 1
            fi
          done

          mkdir package

          cp -R "$SOURCE_DIR/Heightmap Data" package/
          cp -R "$SOURCE_DIR/Planet Data" package/
          cp -R "$SOURCE_DIR/Texture Data" package/

          cp "$SOURCE_DIR/Import_Settings.txt" package/
          cp "$SOURCE_DIR/Space_Center_Data.txt" package/
          cp "$SOURCE_DIR/Version.txt" package/

          python3 - <<'PY'
          import json
          from pathlib import Path

          planet_dir = Path("package") / "Planet Data"
          files = sorted(planet_dir.glob("*.txt"))

          if not files:
              raise SystemExit("Planet Data is empty.")

          for file in files:
              with file.open(encoding="utf-8") as stream:
                  data = json.load(stream)

              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid JSON object: {file.name}")

          print(f"Validated {len(files)} planet files.")
          PY

          echo "HYPERE56 system validation completed!"
          find package -maxdepth 2 -type f -print | sort

      - name: Upload ready-to-install SFS system
        uses: actions/upload-artifact@v4
        with:
          name: HYPERE56-SFS-System
          path: package/
          if-no-files-found: error
          retention-days: 14
