
name: HYPERE56 Texture Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "HYPERE56-Planet-Textures-v1.zip"

permissions:
  contents: write

jobs:
  install-textures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check texture archive
        run: |
          set -euo pipefail

          ZIP="HYPERE56-Planet-Textures-v1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Texture ZIP not found"
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Install PNG textures
        run: |
          set -euo pipefail

          mkdir -p "Texture Data"

          unzip -o "HYPERE56-Planet-Textures-v1.zip" \
            "Texture Data/*.png" -d extracted

          find extracted -type f -name "*.png" -exec cp {} "Texture Data/" \;

          echo "Installed textures:"
          find "Texture Data" -maxdepth 1 -type f -name "*.png" -print

      - name: Validate planet data
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("Planet Data")
          planets = [
              "Cindar", "Vesper", "Aurelia", "Nerith",
              "Kryos", "Thalassa", "Orvax", "Elynd",
              "Morrow", "Umbrielis", "Praxos", "Nival"
          ]

          for name in planets:
              path = folder / f"{name}.txt"

              if not path.is_file():
                  raise SystemExit(f"Missing planet file: {path}")

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON: {path}: {exc}")

              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid planet structure: {path}")

              print(f"VALID: {name}")

          print("All planet TXT files passed validation.")
          PY

      - name: Verify texture inventory
        run: |
          set -euo pipefail

          for name in Cindar Vesper Aurelia Nerith Kryos Thalassa \
                      Orvax Elynd Morrow Umbrielis Praxos Nival; do
            test -s "Texture Data/$name.png" || {
              echo "::error::Missing texture: $name.png"
              exit 1
            }
          done

          test -s "Texture Data/HYPERE56_Star.png"

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Texture Data"

          if git diff --cached --quiet; then
            echo "No new texture files to commit."
          else
            git commit -m "Install HYPERE56 custom textures"
            git push
          fi
