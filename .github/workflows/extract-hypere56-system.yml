
name: HYPERE56 ZIP Extractor

on:
  workflow_dispatch:
  push:
    paths:
      - "HYPERE56-SFS-System.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          set -euo pipefail

          ZIP="HYPERE56-SFS-System.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP file not found: $ZIP"
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Extract ZIP safely
        run: |
          set -euo pipefail

          python3 <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("HYPERE56-SFS-System.zip")
          destination = Path(".")

          with zipfile.ZipFile(archive, "r") as z:
              for item in z.infolist():
                  name = item.filename
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if not path.parts:
                      continue

                  if path.parts[0] == ".git":
                      raise SystemExit("ZIP must not contain .git")

                  target = destination.joinpath(*path.parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, target.open("wb") as output:
                          output.write(source.read())

          print("ZIP extraction completed.")
          PY

      - name: Commit extracted files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract HYPERE56 system package"
            git push
          fi
